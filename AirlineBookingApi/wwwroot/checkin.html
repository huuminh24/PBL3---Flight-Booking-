<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Check-in trực tuyến - SkyHmH</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>tailwind.config={darkMode:"class",theme:{extend:{colors:{rausch:"#ff385c","rausch-active":"#e00b41",ink:"#222222",muted:"#6a6a6a",canvas:"#ffffff",hairline:"#dddddd"},fontFamily:{sans:["Plus Jakarta Sans","sans-serif"]}}}}</script>
<style>body{font-family:'Plus Jakarta Sans',sans-serif}</style>
</head>
<body class="bg-zinc-50 text-zinc-900 antialiased">
<header class="sticky top-0 w-full z-50 bg-white/95 backdrop-blur-md border-b border-zinc-100 shadow-sm"></header>

<main class="max-w-[900px] mx-auto px-6 py-8">
<a href="/" class="inline-flex items-center gap-1 text-zinc-500 hover:text-zinc-800 text-sm font-medium mb-6 transition-colors">
<span class="material-symbols-outlined text-[18px]">arrow_back</span>Về trang chủ
</a>
<h1 class="text-2xl font-bold mb-2">Check-in trực tuyến</h1>
<p class="text-sm text-zinc-500 mb-6">Nhập mã đặt chỗ (PNR) để tìm và check-in chuyến bay của bạn.</p>

<div class="bg-white border border-zinc-200 rounded-xl p-6 mb-6">
<div class="flex flex-col md:flex-row gap-4 items-end mb-6">
  <div class="flex-1 w-full">
    <label class="block text-sm font-bold text-zinc-700 tracking-wide mb-2">Mã đặt chỗ (PNR)</label>
    <input id="input-pnr" class="w-full h-[56px] bg-white border border-zinc-300 rounded-xl px-5 text-base text-zinc-800 focus:border-[#ff385c] focus:ring-1 focus:ring-[#ff385c] outline-none shadow-sm transition-colors" placeholder="Ví dụ: BK26ABCD" type="text"/>
  </div>
  <button id="btn-search" class="h-[56px] bg-[#ff385c] hover:bg-[#e00b41] text-white px-8 rounded-xl font-bold transition-colors shadow-sm whitespace-nowrap">
    Tra cứu
  </button>
</div>
<div id="results" class="space-y-4"></div>
</div>
</main>

<script src="/shared.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  renderNavbar('checkin');
  if (!requireAuth()) return;
  document.getElementById('btn-search').onclick = searchCheckIn;
  document.getElementById('input-pnr').onkeydown = e => { if (e.key === 'Enter') searchCheckIn(); };
});

async function searchCheckIn() {
  const pnr = document.getElementById('input-pnr').value.trim();
  if (!pnr) { toast('Vui lòng nhập mã đặt chỗ (PNR)', 'warning'); return; }
  const resultsDiv = document.getElementById('results');
  resultsDiv.innerHTML = '<p class="text-center text-zinc-400 py-8 animate-pulse">Đang tìm kiếm...</p>';
  try {
    const results = await api('GET', `/checkin/search?pnr=${encodeURIComponent(pnr)}`);
    if (!results.length) {
      resultsDiv.innerHTML = '<p class="text-center text-zinc-400 py-8">Không tìm thấy booking nào với mã PNR này.</p>';
      return;
    }
    resultsDiv.innerHTML = results.map(b => renderBookingCard(b)).join('');
  } catch (e) {
    resultsDiv.innerHTML = `<p class="text-center text-red-400 py-8">${e.message}</p>`;
  }
}

function renderBookingCard(b) {
  const windowBadge = renderWindowBadge(b);
  const ticketsHtml = b.tickets.map(t => {
    if (t.isCheckedIn) {
      return `<div class="flex justify-between items-center p-3 rounded-lg bg-emerald-50 border border-emerald-200">
        <div><span class="font-medium">${esc(t.passengerFullName)}</span><span class="text-xs text-zinc-500 ml-2">${esc(t.passengerType)} · Ghế ${esc(t.seatNumber || 'N/A')} · ${esc(t.seatClass)}</span></div>
        <span class="text-xs bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full font-medium">✓ Đã check-in</span>
      </div>`;
    }
    if (t.ticketStatus === 'Paid') {
      const action = renderCheckinAction(b, t);
      return `<div class="flex justify-between items-center p-3 rounded-lg bg-zinc-50 border border-zinc-200">
        <div><span class="font-medium">${esc(t.passengerFullName)}</span><span class="text-xs text-zinc-500 ml-2">${esc(t.passengerType)} · Ghế ${esc(t.seatNumber || 'Chưa chọn')} · ${esc(t.seatClass)}</span></div>
        ${action}
      </div>`;
    }
    return `<div class="flex justify-between items-center p-3 rounded-lg bg-zinc-50 border border-zinc-200">
      <div><span class="font-medium">${esc(t.passengerFullName)}</span><span class="text-xs text-zinc-500 ml-2">${esc(t.passengerType)} · ${esc(t.seatClass)}</span></div>
      <span class="text-xs text-zinc-400">${statusLabel(t.ticketStatus)}</span>
    </div>`;
  }).join('');

  return `
    <div class="border border-zinc-200 rounded-xl p-5 bg-white">
      <div class="flex justify-between items-center mb-3">
        <div>
          <span class="font-mono font-bold text-[#ff385c]">${b.pnrCode}</span>
          <span class="font-semibold text-zinc-700 ml-2">${b.flightNumber}</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-xs bg-zinc-100 text-zinc-600 px-2 py-0.5 rounded-full">${statusLabel(b.bookingStatus)}</span>
          <span class="text-sm text-zinc-500">${b.departureAirport} → ${b.arrivalAirport}</span>
        </div>
      </div>
      <div class="text-sm text-zinc-500 mb-2">${fmtDateTime(b.departureTime)}</div>
      ${windowBadge}
      <div class="space-y-2 mt-3">${ticketsHtml}</div>
    </div>`;
}

function renderWindowBadge(b) {
  if (b.checkInWindowStatus === 'Open') {
    return `<span class="inline-flex items-center gap-1 text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1 rounded-full font-semibold">
      <span class="material-symbols-outlined text-[14px]">check_circle</span>
      Đang trong cửa sổ check-in (còn ${formatDuration(b.minutesUntilClose)})
    </span>`;
  }
  if (b.checkInWindowStatus === 'NotYetOpen') {
    return `<span class="inline-flex items-center gap-1 text-xs bg-amber-50 text-amber-700 border border-amber-200 px-3 py-1 rounded-full font-semibold">
      <span class="material-symbols-outlined text-[14px]">schedule</span>
      🕒 Mở check-in sau ${formatDuration(b.minutesUntilOpen)}
    </span>`;
  }
  if (b.checkInWindowStatus === 'Closed') {
    return `<span class="inline-flex items-center gap-1 text-xs bg-red-50 text-red-700 border border-red-200 px-3 py-1 rounded-full font-semibold">
      <span class="material-symbols-outlined text-[14px]">block</span>
      ❌ Đã quá hạn check-in online — vui lòng ra quầy
    </span>`;
  }
  return '';
}

function renderCheckinAction(b, t) {
  if (b.checkInWindowStatus === 'NotYetOpen') {
    return `<button disabled class="text-xs bg-zinc-200 text-zinc-500 px-4 py-1.5 rounded-lg font-medium cursor-not-allowed" title="Mở check-in sau ${formatDuration(b.minutesUntilOpen)}">Chưa mở check-in</button>`;
  }
  if (b.checkInWindowStatus === 'Closed') {
    return `<span class="text-xs text-red-500 font-medium">Đã quá hạn — ra quầy</span>`;
  }
  return `<button onclick='goCheckIn(${t.ticketId}, ${b.flightId}, ${JSON.stringify(t.seatClass)}, ${JSON.stringify(t.passengerFullName || '')})' class="text-xs bg-[#ff385c] hover:bg-[#e00b41] text-white px-4 py-1.5 rounded-lg font-medium transition-colors">Chọn ghế &amp; Check-in</button>`;
}

function formatDuration(minutes) {
  const m = Math.max(0, minutes);
  if (m < 60) return `${m} phút`;
  const h = Math.floor(m / 60);
  const rest = m % 60;
  return rest > 0 ? `${h} giờ ${rest} phút` : `${h} giờ`;
}

function goCheckIn(ticketId, flightId, cls, name) {
  window.location.href = `/checkin-seat.html?checkin=true&ticketId=${ticketId}&flightId=${flightId}&cls=${encodeURIComponent(cls)}&paxName=${encodeURIComponent(name)}`;
}
</script>
</body>
</html>

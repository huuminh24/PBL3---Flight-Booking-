<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Chọn ghế & Check-in - SkyHmH</title>
<script>
// This page has been merged into checkin-seat.html
// Redirect to the correct page with same parameters
const urlParams = new URLSearchParams(window.location.search);
const ticketId = urlParams.get('ticketId');
const flightId = urlParams.get('flightId');
const cls = urlParams.get('cls');
const name = urlParams.get('name') || urlParams.get('paxName') || '';
window.location.href = `/checkin-seat.html?checkin=true&ticketId=${ticketId}&flightId=${flightId}&cls=${cls}&paxName=${encodeURIComponent(name)}`;
</script>
</head>
<body></body>
</html>

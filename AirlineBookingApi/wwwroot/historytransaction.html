<!DOCTYPE html>

<html lang="vi">

<head>

<meta charset="utf-8"/>

<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<title>Lịch sử đặt vé - SkyHmH</title>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

<script>tailwind.config={darkMode:"class",theme:{extend:{colors:{rausch:"#ff385c","rausch-active":"#e00b41",ink:"#222222",muted:"#6a6a6a",canvas:"#ffffff",hairline:"#dddddd"},fontFamily:{sans:["Plus Jakarta Sans","sans-serif"]}}}}</script>

<style>body{font-family:'Plus Jakarta Sans',sans-serif}</style>

</head>

<body class="bg-zinc-50 text-zinc-900 antialiased">

<header class="sticky top-0 w-full z-50 bg-white/95 backdrop-blur-md border-b border-zinc-100 shadow-sm"></header>



<main class="max-w-[900px] mx-auto px-6 py-8">

  <h1 class="text-2xl font-bold mb-6">Lịch sử đặt vé</h1>

  <div id="booking-list" class="space-y-4">

    <div class="text-center py-20 text-zinc-400">

      <span class="material-symbols-outlined text-5xl mb-4 block animate-pulse">hourglass_empty</span>

      <p>Đang tải...</p>

    </div>

  </div>

</main>



<!-- Detail Modal -->

<div id="detail-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center">

  <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="closeModal('detail-modal')"></div>

  <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-lg mx-4 max-h-[80vh] overflow-y-auto">

    <div class="sticky top-0 bg-white p-5 border-b border-zinc-100 flex justify-between items-center z-10">

      <h2 class="text-lg font-bold">Chi tiết đặt vé</h2>

      <button onclick="closeModal('detail-modal')" class="text-zinc-400 hover:text-zinc-800 p-1 rounded-full hover:bg-zinc-100"><span class="material-symbols-outlined">close</span></button>

    </div>

    <div id="detail-content" class="p-5"></div>

  </div>

</div>



<script src="/shared.js"></script>

<script>

document.addEventListener('DOMContentLoaded', async () => {

  renderNavbar('history');

  if (!requireAuth()) return;

  await loadBookings();

});



async function loadBookings() {

  const list = document.getElementById('booking-list');

  try {

    const bookings = await api('GET', '/History/my-bookings');

    if (!bookings.length) {

      list.innerHTML = `<div class="text-center py-20 text-zinc-400"><span class="material-symbols-outlined text-5xl mb-4 block">flight_takeoff</span><p class="text-lg font-medium">Chưa có đặt vé nào</p><a href="/" class="text-[#ff385c] font-semibold mt-2 inline-block hover:underline">Đặt vé ngay</a></div>`;

      return;

    }

    list.innerHTML = bookings.map(b => {

      const statusColors = { PendingPayment:'bg-amber-100 text-amber-700', Confirmed:'bg-blue-100 text-blue-700', Paid:'bg-emerald-100 text-emerald-700', Cancelled:'bg-zinc-200 text-zinc-500', CheckedIn:'bg-sky-100 text-sky-700' };

      const statusLabels = { PendingPayment:'Chờ thanh toán', Paid:'Đã thanh toán', Cancelled:'Đã hủy', CheckedIn:'Đã check-in', Confirmed:'Đã xác nhận' };

      const sc = statusColors[b.bookingStatus] || 'bg-zinc-100 text-zinc-600';

      const sl = statusLabels[b.bookingStatus] || b.bookingStatus;

      

      const flightsHtml = b.flights.map(f => `

        <div class="flex items-center gap-4 text-sm mt-2">

          <span class="material-symbols-outlined text-zinc-400 text-[18px]">flight</span>

          <span class="font-medium">${f.flightNumber}</span>

          <span class="text-zinc-400">·</span>

          <span>${f.departureAirport} → ${f.arrivalAirport}</span>

          <span class="text-zinc-400">·</span>

          <span class="text-zinc-500">${fmtDate(f.departureTime)}</span>

        </div>

      `).join('');



      return `

      <div class="bg-white border border-zinc-200 rounded-xl p-5 hover:shadow-md transition-shadow cursor-pointer" onclick="showDetail(${b.bookingId})">

        <div class="flex justify-between items-start mb-3">

          <div>

            <span class="font-mono text-[#ff385c] font-bold">${b.pnrCode}</span>

            <span class="text-xs ${sc} px-2 py-0.5 rounded-full ml-2">${sl}</span>

          </div>

          <span class="text-lg font-bold text-zinc-800">${fmt(b.totalAmount)}</span>

        </div>

        ${flightsHtml}

        <div class="mt-2 text-sm text-zinc-500">${b.passengerCount} Hành khách</div>

      </div>`;

    }).join('');

  } catch(e) { list.innerHTML = `<div class="text-center py-10 text-red-400">${e.message}</div>`; }

}



async function showDetail(id) {

  try {

    const b = await api('GET', `/History/my-bookings/${id}`);

    const statusLabels = { PendingPayment:'Chờ thanh toán', Paid:'Đã thanh toán', Cancelled:'Đã hủy', CheckedIn:'Đã check-in', CancelRequested:'Đang chờ hủy' };

    

    const flightsHtml = b.flights.map((f, i) => `

      <div class="mb-2">

        <div class="text-xs font-bold text-zinc-400 uppercase tracking-wider">Chặng ${i + 1}</div>

        <div class="flex justify-between"><span class="text-zinc-500">Chuyến bay</span><span class="font-semibold">${f.flightNumber}</span></div>

        <div class="flex justify-between"><span class="text-zinc-500">Tuyến</span><span class="font-semibold">${f.departureAirport} → ${f.arrivalAirport}</span></div>

        <div class="flex justify-between"><span class="text-zinc-500">Khởi hành</span><span class="font-semibold">${fmtDateTime(f.departureTime)}</span></div>

      </div>

    `).join('');



    const showInvoice = b.bookingStatus === 'Paid' || b.bookingStatus === 'CheckedIn';

    const invoiceBtn = showInvoice

      ? `<a href="/invoice.html?bookingId=${id}" class="inline-flex items-center gap-1 h-9 px-3 bg-[#ff385c] hover:bg-[#e00b41] text-white text-xs font-semibold rounded-lg transition-colors shadow-sm">

           <span class="material-symbols-outlined text-[16px]">receipt_long</span>Xem hóa đơn

         </a>`

      : '';



    document.getElementById('detail-content').innerHTML = `

      <div class="space-y-4 text-sm">

        ${showInvoice ? `<div class="flex justify-end mb-2">${invoiceBtn}</div>` : ''}

        <div class="grid grid-cols-2 gap-3 mb-4">

          <div><span class="text-zinc-500">PNR</span><div class="font-mono font-bold text-[#ff385c]">${b.pnrCode}</div></div>

          <div><span class="text-zinc-500">Trạng thái</span><div class="font-semibold">${statusLabels[b.bookingStatus] || b.bookingStatus}</div></div>

          <div><span class="text-zinc-500">Tổng tiền</span><div class="font-bold text-[#ff385c]">${fmt(b.totalAmount)}</div></div>

        </div>

        ${flightsHtml}

        <hr class="border-zinc-100"/>

        <h4 class="font-bold">Vé (${b.tickets.length})</h4>

        ${b.tickets.map(t => {

          const tsl = statusLabels[t.ticketStatus] || t.ticketStatus;

          const checkedIn = t.isCheckedIn;

          

          // Check-in button logic

          let checkinBtn = '';

          if (checkedIn) {

            checkinBtn = '<span class="text-xs bg-sky-100 text-sky-700 px-3 py-1 rounded-full font-medium">✓ Đã check-in</span>';

          } else if (t.ticketStatus === 'Paid') {

            const safeName = (t.passengerFullName || '').replace(/'/g, "\\'");
            const safeSeatClass = (t.seatClass || '').replace(/'/g, "\\'");

            checkinBtn = `<button onclick="doCheckIn(${t.ticketId}, ${t.flightId}, '${safeSeatClass}', '${safeName}')" class="text-xs bg-[#ff385c] hover:bg-[#e00b41] text-white px-3 py-1.5 rounded-lg font-medium transition-colors">Chọn ghế & Check-in</button>`;

          }

          

          // Cancel button logic

          let cancelBtn = '';

          if (t.ticketStatus === 'Paid' && !checkedIn) {

            const tooltip = 'Yêu cầu sẽ được nhân viên xác nhận trong vòng 24 giờ. Hoàn tiền: Phổ thông 50%, Thương gia 90% giá vé.';

            cancelBtn = `<button onclick="requestCancel(${t.ticketId})" title="${tooltip}" class="text-xs text-red-500 hover:text-red-700 font-medium underline">Yêu cầu hủy</button>`;

          }

          

          return `

          <div class="border border-zinc-100 rounded-lg p-3">

            <div class="flex justify-between items-center mb-1">

              <span class="font-medium">${t.passengerFullName} (${t.passengerType})</span>

              <span class="text-xs ${t.ticketStatus==='Paid'?'bg-emerald-100 text-emerald-700': t.ticketStatus==='CheckedIn'?'bg-sky-100 text-sky-700':'bg-zinc-100 text-zinc-600'} px-2 py-0.5 rounded-full">${tsl}</span>

            </div>

            <div class="text-xs text-zinc-500">CB: ${t.flightNumber || ''} · Ghế ${t.seatNumber || 'Chưa chọn'} · ${t.seatClass} · ${fmt(t.price)}</div>

            <div class="flex items-center gap-3 mt-2">

              ${checkinBtn}

              ${cancelBtn}

            </div>

          </div>`;

        }).join('')}

      </div>`;

    openModal('detail-modal');

  } catch(e) { toast(e.message,'error'); }

}



function doCheckIn(ticketId, flightId, cls, name) {

    window.location.href = `/checkin-seat.html?checkin=true&ticketId=${ticketId}&flightId=${flightId}&cls=${encodeURIComponent(cls)}&paxName=${encodeURIComponent(name)}`;

}



async function requestCancel(ticketId) {

  const reason = await askPrompt('Lý do hủy vé (sẽ gửi tới nhân viên xác nhận):', 'Yêu cầu hủy vé');

  if (!reason) return;

  try {

    const res = await api('POST', '/CancelRequests', { ticketId, reason });

    closeModal('detail-modal');

    showCancelSentModal(res);

  } catch(e) { toast(e.message,'error'); }

}



function showCancelSentModal(res) {

  const old = document.getElementById('cancel-sent-modal');

  if (old) old.remove();

  const refund = typeof res.refundAmount === 'number' ? fmt(res.refundAmount) : '';

  const div = document.createElement('div');

  div.id = 'cancel-sent-modal';

  div.className = 'fixed inset-0 z-[300] flex items-center justify-center';

  div.innerHTML = `

    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>

    <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-sm mx-4 overflow-hidden">

      <div class="p-6 space-y-3 text-center">

        <span class="material-symbols-outlined text-emerald-500 text-5xl block">mark_email_read</span>

        <h3 class="text-lg font-bold">Đã gửi yêu cầu hủy</h3>

        <p class="text-sm text-zinc-600">Mã yêu cầu <span class="font-mono font-bold text-[#ff385c]">#${res.cancelRequestId}</span></p>

        ${refund ? `<p class="text-sm text-zinc-600">Hoàn tiền dự kiến: <span class="font-bold">${refund}</span></p>` : ''}

        <p class="text-xs text-zinc-500">Trạng thái sẽ cập nhật trong lịch sử đặt vé khi nhân viên xác nhận.</p>

      </div>

      <div class="p-4 bg-zinc-50 border-t border-zinc-100 flex justify-end">

        <button id="cancel-sent-ok" class="px-4 py-2 text-sm font-semibold bg-[#ff385c] hover:bg-[#e00b41] text-white rounded-lg transition-colors shadow-sm">Đã hiểu</button>

      </div>

    </div>`;

  document.body.appendChild(div);

  document.getElementById('cancel-sent-ok').onclick = () => {

    div.remove();

    loadBookings();

  };

}

</script>

</body>

</html>
